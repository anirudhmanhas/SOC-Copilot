id: RULE-AUTH-002
name: Password Spraying Detection
severity: HIGH
source: ssh
mitre_technique: T1110.003
description: Detects a single IP address attempting failed authentication across 5 or more distinct usernames.
detection:
  type: threshold
  field: src_ip
  distinct_field: user
  conditions:
    event_type: login_failed
    status: failed
  count: 5
  window_seconds: 300
action_recommendations:
  - action_type: block_ip
    description: Quarantine attacking source IP at perimeter firewall
  - action_type: disable_user
    description: Force credential reset for targeted accounts

